<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinium - Query Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Space Grotesk', sans-serif;
        }

        .blueprint-underline {
            position: relative;
        }

        .blueprint-underline::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #38BDF8 0%, transparent 100%);
            opacity: 0.5;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="flex h-screen bg-white">
        <!-- Sidebar -->
        <aside class="w-64 h-screen bg-white border-r-2 border-[#1E3A8A] flex flex-col relative">
            <div
                class="absolute right-4 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-[#E2E8F0] to-transparent">
            </div>

            <!-- Logo -->
            <div class="p-6 border-b-2 border-[#E2E8F0]">
                <div class="flex items-center gap-2 blueprint-underline">
                    <i data-lucide="brain" class="w-8 h-8 text-[#1E3A8A]" stroke-width="1.5"></i>
                    <div>
                        <span class="text-xl font-semibold text-[#0F172A]">Infinium</span>
                        <p class="text-[10px] text-gray-500 mt-0.5">Knowledge AI</p>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-4 space-y-1">
                <!-- Dashboard -->
                <div class="relative">
                    <button
                        class="w-full justify-start gap-3 flex items-center px-4 py-2 text-[#64748B] hover:text-[#1E3A8A] hover:bg-[#F8FAFC] border-l-2 border-transparent transition-colors rounded-sm">
                        <i data-lucide="layout-dashboard" class="w-5 h-5" stroke-width="1.5"></i>
                        <span class="text-sm">Dashboard</span>
                    </button>
                </div>
                <!-- Query Interface (Active) -->
                <div class="relative">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-[#38BDF8] rounded-r"></div>
                    <button
                        class="w-full justify-start gap-3 flex items-center px-4 py-2 bg-[#1E3A8A] text-white border-l-2 border-[#38BDF8] rounded-sm">
                        <i data-lucide="message-square" class="w-5 h-5" stroke-width="1.5"></i>
                        <span class="text-sm">Query Interface</span>
                    </button>
                </div>
                <!-- ... other items ... -->
            </nav>
            <!-- User -->
            <div class="p-4 border-t-2 border-[#E2E8F0]">
                <div class="flex items-center gap-3 p-3 border-2 border-[#CBD5E1] rounded-sm">
                    <div
                        class="w-10 h-10 bg-[#1E3A8A] border-2 border-[#38BDF8] rounded-full flex items-center justify-center text-white font-semibold">
                        DM
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-[#0F172A] text-sm font-medium truncate">Dev Manager</p>
                        <p class="text-[#64748B] text-xs truncate">dev@company.com</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="border-b border-gray-200 bg-white px-8 py-6">
                <div class="flex items-center gap-3 mb-2">
                    <div class="p-2 bg-gradient-to-br from-indigo-500 to-blue-500 rounded-lg">
                        <i data-lucide="message-square" class="w-5 h-5 text-white"></i>
                    </div>
                    <h1 class="text-2xl">Query Interface</h1>
                </div>
                <p class="text-gray-600">Quickly search and retrieve code snippets</p>
            </div>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-8 flex flex-col items-center justify-center bg-gray-50">
                <div class="w-full max-w-3xl text-center">
                    <h2 class="text-3xl font-bold text-gray-900 mb-6">What are you looking for?</h2>

                    <div class="relative mb-8">
                        <input type="text"
                            placeholder="Search for function definitions, usage examples, or error logs..."
                            class="w-full px-6 py-5 rounded-2xl shadow-lg border-0 focus:ring-4 focus:ring-blue-100 text-lg">
                        <button
                            class="absolute right-3 top-2 bottom-2 bg-blue-600 text-white px-6 rounded-xl font-medium hover:bg-blue-700 transition-colors">
                            Search
                        </button>
                    </div>

                    <div class="flex justify-center gap-3 flex-wrap">
                        <button
                            class="px-4 py-2 bg-white rounded-full border border-gray-200 text-sm text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors">
                            auth middleware
                        </button>
                        <button
                            class="px-4 py-2 bg-white rounded-full border border-gray-200 text-sm text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors">
                            database schema
                        </button>
                        <button
                            class="px-4 py-2 bg-white rounded-full border border-gray-200 text-sm text-gray-600 hover:border-blue-300 hover:text-blue-600 transition-colors">
                            API rate limits
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
